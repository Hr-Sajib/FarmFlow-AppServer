services:
  farmflow-api:
    container_name: farmflow-api
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # Nothing here needs a Linux capability: each process runs as a non-root
    # user and binds a port above 1024. Dropping them all shrinks what a code
    # execution bug could reach for next, and no-new-privileges stops a setuid
    # binary inside the image from being used to climb back out.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file:
      - .env
    networks:
      - sajib-net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:5002/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  sajib-net:
    external: true
